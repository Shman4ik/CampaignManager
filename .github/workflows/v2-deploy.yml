# Деплой 2.0: образ из src/Dockerfile и коммит тега в dmnet-gitops, workloads/campaign-manager (прод,
# https://cthulhu.dmnet.dev, Neon main). Дальше Argo CD сам катит его в k3s. Прод на 2.0 с 2026-10-04 (T3.2,
# docs/v2/CUTOVER.md); v1 не деплоится; beta-стенд погашен 2026-10-05.
# Устройство, секреты и откат — src/CLAUDE.md, «Деплой».
name: v2 deploy

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.config"
      - ".github/workflows/v2-deploy.yml"
  workflow_dispatch:

concurrency:
  group: v2-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/shman4ik/campaign-manager-v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      # Публикация — на раннере, а не внутри образа: SDK тут уже стоит, а в образе каждый прогон
      # тянул SDK-образ и гонял кэш слоёв (подробности — в src/Dockerfile, стадия prebuilt).
      # Версии — те же, что в CI.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Анализаторы уже отработали в CI на PR с -warnaserror; здесь они только тратят время.
      # Генераторы (Razor, JSON) при RunAnalyzers=false работают как обычно.
      # -r linux-x64: образ только amd64, а без RID SkiaSharp кладёт нативные библиотеки всех платформ (~450 МБ).
      - name: Publish
        run: >-
          dotnet publish src/CampaignManager.Server/CampaignManager.Server.csproj
          -c Release -o artifacts/v2 -r linux-x64 --no-self-contained -p:UseAppHost=false -p:RunAnalyzers=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 0.3.N — счётчик воркфлоу v2-deploy: 0.1.N — v1, 0.2.N — прежний v2-beta-deploy.
      # После переименования счётчик начался заново — 0.2.N повторил бы старые теги.
      - name: Set version
        run: echo "VERSION=0.3.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Dockerfile
          target: prebuilt
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Check out dmnet-gitops
        uses: actions/checkout@v7
        with:
          repository: Shman4ik/dmnet-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      # Деплой = коммит тега в dmnet-gitops; Argo CD применяет его за ~90 с. К VPS никто не ходит.
      - name: Point dmnet-gitops at the new image
        working-directory: gitops/workloads
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(VERSION)' campaign-manager/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "campaign-manager ${VERSION}" -m "Built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          for attempt in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1

      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: campaign-manager-v2
          package-type: container
          # Старые теги остаются для отката (revert коммита тега в dmnet-gitops).
          min-versions-to-keep: 10
          ignore-versions: "^latest$"
