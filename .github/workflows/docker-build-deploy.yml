name: Build and Deploy

on:
  push:
    branches: ["master"]
    # Only what goes into the v1 image. Every deploy restarts the pod and drops the Keeper's
    # circuits mid-session, so a docs-only or v2-only merge must not redeploy production.
    # Directory.Packages.props is left out on purpose: v1 projects do not import it
    # (see Directory.Build.props), while Directory.Build.props itself is imported.
    paths:
      - "CampaignManager.Web/**"
      - "CampaignManager.ServiceDefaults/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Build.props"
      - "global.json"
      - "NuGet.config"
      - ".github/workflows/docker-build-deploy.yml"
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set version
        id: version
        run: |
          echo "VERSION=0.1.${{ github.run_number }}" >> $GITHUB_ENV
          echo "Using version: 0.1.${{ github.run_number }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shman4ik/campaign-manager:latest
            ghcr.io/shman4ik/campaign-manager:${{ env.VERSION }}
          cache-from: type=gha,scope=v1
          cache-to: type=gha,mode=max,scope=v1

      - name: Check out dmnet-gitops
        uses: actions/checkout@v7
        with:
          repository: Shman4ik/dmnet-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      # Deploy = commit the new tag to dmnet-gitops; Argo CD in the cluster applies it within ~90 s.
      # Nothing connects to the VPS.
      - name: Point dmnet-gitops at the new image
        working-directory: gitops/workloads/campaign-manager
        run: |
          yq -i '(.images[] | select(.name == "ghcr.io/shman4ik/campaign-manager")).newTag = strenv(VERSION)' kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "campaign-manager ${VERSION}" -m "Built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          for attempt in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1

      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: campaign-manager
          package-type: container
          # Older tags stay pullable for rollbacks (revert the tag commit in dmnet-gitops).
          min-versions-to-keep: 10
          ignore-versions: "^latest$"
